<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الحساب — رَابِـح</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800/80 border border-slate-700/80 rounded-3xl p-8 shadow-2xl backdrop-blur">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-4 border border-amber-500/30">🔑</div>
            <h2 class="text-2xl font-extrabold text-white">تفعيل الرخصة الكاملة</h2>
            <p class="text-sm text-slate-400 mt-2">أدخل كود التفعيل المكون من 16 خانة الممنوح لك عند الشراء</p>
        </div>

        <div id="status-msg" class="hidden mb-4 p-3 text-sm rounded-xl text-center"></div>

        <form id="activate-form" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">كود التفعيل (Activation Code)</label>
                <input type="text" id="code" required placeholder="RBH-7X92-KD31-AB58" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-amber-400 font-mono text-center text-lg tracking-wider">
            </div>
            <button type="submit" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 transition-all font-bold text-slate-950 rounded-xl shadow-lg shadow-amber-500/20">تفعيل الأداة الآن</button>
        </form>

        <div class="text-center mt-6">
            <a href="dashboard.html" class="text-sm text-slate-400 hover:text-white">العودة للوحة التحكم</a>
        </div>
    </div>

    <script>
        document.getElementById('activate-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();
            const statusMsg = document.getElementById('status-msg');
            const token = localStorage.getItem('rabeh_token');

            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch('http://localhost:5000/api/activation/activate', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ code })
                });
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'كود التفعيل غير صالح');

                statusMsg.className = "mb-4 p-3 text-sm rounded-xl text-center bg-emerald-950/60 border border-emerald-800 text-emerald-300";
                statusMsg.textContent = "تم تفعيل حسابك بنجاح! جاري توجيهك...";
                statusMsg.classList.remove('hidden');

                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } catch (err) {
                statusMsg.className = "mb-4 p-3 text-sm rounded-xl text-center bg-red-950/60 border border-red-800 text-red-300";
                statusMsg.textContent = err.message;
                statusMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
