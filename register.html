<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب — رَابِـح</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800/80 border border-slate-700/80 rounded-3xl p-8 shadow-2xl backdrop-blur">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-4 shadow-lg shadow-emerald-600/30">📈</div>
            <h2 class="text-2xl font-extrabold text-white">إنشاء حساب جديد في رَابِـح</h2>
            <p class="text-sm text-slate-400 mt-2">ابدأ تجريتك المجانية واكشف تسريب أرباح متجرك</p>
        </div>

        <div id="error-msg" class="hidden mb-4 p-3 bg-red-950/60 border border-red-800 text-red-300 text-sm rounded-xl text-center"></div>

        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">الاسم الكامل</label>
                <input type="text" id="full_name" required placeholder="أحمد محمد" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-white text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">اسم المتجر / العلامة التجارية</label>
                <input type="text" id="store_name" placeholder="متجر الأناقة" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-white text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@store.com" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-white text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-white text-sm">
            </div>
            <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 transition-all font-bold text-white rounded-xl shadow-lg shadow-emerald-600/30 mt-2">إنشاء حساب والتجربة مجاناً</button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            لديك حساب بالفعل؟ <a href="login.html" class="text-emerald-400 font-semibold hover:underline">تسجيل الدخول</a>
        </p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('full_name').value;
            const store_name = document.getElementById('store_name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const res = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, store_name, email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'فشل إنشاء الحساب');

                localStorage.setItem('rabeh_token', data.token);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
