<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات — رَابِـح</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <nav class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 p-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <span class="text-2xl font-extrabold text-white">رَابِـح <span class="text-emerald-500">Rabeh</span></span>
            <div class="flex items-center gap-6 text-sm font-medium">
                <a href="dashboard.html" class="hover:text-emerald-400">الرئيسية</a>
                <a href="orders.html" class="text-emerald-400">الطلبات</a>
                <a href="products.html" class="hover:text-emerald-400">المنتجات</a>
                <a href="analytics.html" class="hover:text-emerald-400">تحليل التسريب</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <h1 class="text-2xl font-extrabold text-white mb-6">إضافة طلب جديد</h1>

        <form id="add-order-form" class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700 grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <input type="text" id="product_name" required placeholder="اسم المنتج" class="px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm">
            <input type="number" id="selling_price" required placeholder="سعر البيع" class="px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm">
            <input type="number" id="product_cost" required placeholder="تكلفة المنتج" class="px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm">
            <input type="number" id="shipping_cost" placeholder="تكلفة الشحن" class="px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm">
            <input type="number" id="ad_cost" placeholder="تكلفة الإعلان" class="px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm">
            <select id="status" class="px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm">
                <option value="completed">مكتمل</option>
                <option value="returned">مرتجع</option>
                <option value="cancelled">ملغي</option>
            </select>
            <button type="submit" class="md:col-span-3 py-3 bg-emerald-600 font-bold rounded-xl text-white">حفظ الطلب وحساب الأرباح</button>
        </form>
    </main>
</body>
</html>
